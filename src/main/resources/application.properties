spring.application.name=dbPostgrese
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.ddl-auto=update

jwt.secret=F7Ysl1dnqvW14GOwYl6CptfVTRnZ1MHfCz5uE6yIXo7vME8BQ2sJAYMwJGhLd8Pf
# JWT expiration time in milliseconds (1 day) 86400000
# (2 mins) 120000 (1 min)60000 (3 hr) 10800000
# (1 day) 86400000 (15 mins)900000
jwt.access.expiration.ms=10800000
jwt.refresh.expiration.ms=86400000

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.access=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql=TRACE

app.issuer=auth-service

# By default, Spring Boot only allows 1 MB for multipart files.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

spring.flyway.enabled=true
#Baseline Flyway (recommended way for an existing DB)
spring.flyway.baseline-on-migrate=true